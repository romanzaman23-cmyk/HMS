<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Viewer - Highlight Model School</title>
  <script src="/pdfjs/pdf.min.js"></script>
  <script src="/pdfjs/pdf.worker.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #323639;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      color: #fff;
    }
    header {
      background: #202124;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      z-index: 100;
      flex-wrap: wrap;
      gap: 12px;
      user-select: none;
    }
    .left-section {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .badge {
      background: #e11d48;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
      color: #f1f3f4;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f1f3f4;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.18);
    }
    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-primary {
      background: #1a73e8;
      border-color: #1a73e8;
      color: white;
      font-weight: 600;
    }
    .btn-primary:hover {
      background: #1557b0;
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 4px;
    }
    .page-indicator {
      font-size: 12px;
      color: #dadce0;
      font-weight: 500;
      min-width: 75px;
      text-align: center;
    }
    #viewport-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      background-color: #323639;
      scroll-behavior: smooth;
    }
    .canvas-wrapper {
      background: white;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      border-radius: 4px;
      margin-bottom: 24px;
      overflow: hidden;
      line-height: 0;
      position: relative;
    }
    canvas {
      display: block;
    }
    #status-msg {
      margin-top: 100px;
      text-align: center;
      font-size: 14px;
      color: #dadce0;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @media print {
      header { display: none !important; }
      body, #viewport-container { background: white !important; padding: 0 !important; overflow: visible !important; }
      .canvas-wrapper { box-shadow: none !important; margin: 0 !important; page-break-after: always; }
    }
  </style>
</head>
<body>
  <header>
    <div class="left-section">
      <span class="badge">PDF</span>
      <span class="title" id="docTitle">Loading Document...</span>
    </div>

    <div class="toolbar">
      <button class="btn" id="prevBtn" title="Previous Page">&larr; Prev</button>
      <span class="page-indicator" id="pageIndicator">- / -</span>
      <button class="btn" id="nextBtn" title="Next Page">Next &rarr;</button>

      <div class="divider"></div>

      <button class="btn" id="zoomOutBtn" title="Zoom Out">&minus;</button>
      <button class="btn" id="zoomResetBtn" title="Fit / Reset Zoom">115%</button>
      <button class="btn" id="zoomInBtn" title="Zoom In">&plus;</button>

      <div class="divider"></div>

      <button class="btn" id="printBtn" title="Print Document">&#128438; Print</button>
      <a class="btn btn-primary" id="downloadBtn" href="#" title="Download Document">&#128190; Download</a>
    </div>
  </header>

  <div id="viewport-container">
    <div id="status-msg">
      <div class="spinner"></div>
      <div>Loading document...</div>
    </div>
    <div id="pages-container" style="display:none; display:flex; flex-direction:column; align-items:center;"></div>
  </div>

  <script>
    // Ensure worker is configured immediately
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';
    }

    const params = new URLSearchParams(window.location.search);
    const docId = params.get('id');
    const docPath = params.get('path');
    const fileUrl = params.get('file');
    const docType = params.get('type'); // 'result' or empty
    const docTitle = params.get('title') || 'Academic Document';

    document.title = docTitle + ' - Highlight Model School';
    document.getElementById('docTitle').innerText = docTitle;

    let pdfDoc = null;
    let currentScale = 1.15;
    let pdfBytes = null;
    let activePage = 1;

    async function fetchPayload() {
      // Build candidate endpoints in order of priority
      const endpoints = [];

      if (docType === 'result' && docId) {
        endpoints.push('/api/results/documents/' + docId + '/preview');
      } else if (docId) {
        endpoints.push('/api/documents/' + docId + '/preview');
        endpoints.push('/api/results/documents/' + docId + '/preview');
      }

      if (docPath) {
        endpoints.push('/api/documents/preview-file?path=' + encodeURIComponent(docPath));
      }

      if (fileUrl) {
        const docMatch = fileUrl.match(/\/api\/documents\/(\d+)\/download/);
        const resMatch = fileUrl.match(/\/api\/results\/documents\/(\d+)\/download/);
        if (docMatch) {
          endpoints.push('/api/documents/' + docMatch[1] + '/preview');
        } else if (resMatch) {
          endpoints.push('/api/results/documents/' + resMatch[1] + '/preview');
        } else {
          endpoints.push('/api/documents/preview-file?path=' + encodeURIComponent(fileUrl));
        }
      }

      let lastError = 'No document source found.';
      for (const ep of endpoints) {
        try {
          const res = await fetch(ep);
          if (res.ok) {
            const data = await res.json();
            if (data.success && data.base64) {
              return data;
            }
          }
        } catch (e) {
          lastError = e.message;
        }
      }
      throw new Error(lastError || 'Unable to fetch document preview data.');
    }

    async function loadDocument() {
      const statusEl = document.getElementById('status-msg');
      const pagesContainer = document.getElementById('pages-container');

      try {
        let attempts = 0;
        while (!window.pdfjsLib && attempts < 30) {
          await new Promise(r => setTimeout(r, 80));
          attempts++;
        }
        if (!window.pdfjsLib) {
          throw new Error('PDF viewing engine failed to load.');
        }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/pdf.worker.min.js';

        const json = await fetchPayload();

        // Convert base64 to in-memory Uint8Array
        const binaryStr = atob(json.base64);
        const len = binaryStr.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryStr.charCodeAt(i);
        }
        pdfBytes = bytes;

        // Configure Download button with in-memory blob
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const blobUrl = URL.createObjectURL(blob);
        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = blobUrl;
        downloadBtn.download = docTitle.toLowerCase().endsWith('.pdf') ? docTitle : (docTitle + '.pdf');

        // Parse document with PDF.js
        const loadingTask = window.pdfjsLib.getDocument({
          data: bytes,
          isEvalSupported: false
        });
        pdfDoc = await loadingTask.promise;

        statusEl.style.display = 'none';
        pagesContainer.style.display = 'flex';

        updatePageIndicator();
        renderAllPages();
      } catch (err) {
        console.error('PDF Load Error:', err);
        statusEl.innerHTML = '<div style="color:#ef4444; font-weight:600; margin-bottom:8px;">Failed to load document preview</div><div style="font-size:12px; color:#9ca3af;">' + err.message + '</div>';
      }
    }

    function updatePageIndicator() {
      if (!pdfDoc) return;
      document.getElementById('pageIndicator').innerText = activePage + ' / ' + pdfDoc.numPages;
      document.getElementById('prevBtn').disabled = (activePage <= 1);
      document.getElementById('nextBtn').disabled = (activePage >= pdfDoc.numPages);
      document.getElementById('zoomResetBtn').innerText = Math.round(currentScale * 100) + '%';
    }

    async function renderAllPages() {
      if (!pdfDoc) return;
      const pagesContainer = document.getElementById('pages-container');
      pagesContainer.innerHTML = '';

      const outputScale = window.devicePixelRatio || 1;

      for (let num = 1; num <= pdfDoc.numPages; num++) {
        const page = await pdfDoc.getPage(num);
        const viewport = page.getViewport({ scale: currentScale });

        const wrapper = document.createElement('div');
        wrapper.className = 'canvas-wrapper';
        wrapper.id = 'page-' + num;
        wrapper.dataset.pageNum = num;

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + 'px';
        canvas.style.height = Math.floor(viewport.height) + 'px';

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        wrapper.appendChild(canvas);
        pagesContainer.appendChild(wrapper);

        await page.render({
          canvasContext: ctx,
          transform: transform,
          viewport: viewport
        }).promise;
      }
    }

    // Scroll tracking to update current active page number
    const viewportContainer = document.getElementById('viewport-container');
    viewportContainer.addEventListener('scroll', () => {
      if (!pdfDoc) return;
      const wrappers = document.querySelectorAll('.canvas-wrapper');
      const containerTop = viewportContainer.scrollTop;
      const containerHeight = viewportContainer.clientHeight;
      const triggerY = containerTop + containerHeight / 3;

      for (let i = 0; i < wrappers.length; i++) {
        const wrap = wrappers[i];
        const top = wrap.offsetTop;
        const bottom = top + wrap.offsetHeight;
        if (triggerY >= top && triggerY <= bottom) {
          const num = parseInt(wrap.dataset.pageNum, 10);
          if (num && num !== activePage) {
            activePage = num;
            updatePageIndicator();
          }
          break;
        }
      }
    });

    document.getElementById('prevBtn').onclick = () => {
      if (activePage > 1) {
        activePage--;
        scrollToPage(activePage);
      }
    };

    document.getElementById('nextBtn').onclick = () => {
      if (pdfDoc && activePage < pdfDoc.numPages) {
        activePage++;
        scrollToPage(activePage);
      }
    };

    function scrollToPage(num) {
      const target = document.getElementById('page-' + num);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        updatePageIndicator();
      }
    }

    document.getElementById('zoomInBtn').onclick = () => {
      currentScale = Math.min(currentScale + 0.2, 3.0);
      updatePageIndicator();
      renderAllPages();
    };

    document.getElementById('zoomOutBtn').onclick = () => {
      currentScale = Math.max(currentScale - 0.2, 0.5);
      updatePageIndicator();
      renderAllPages();
    };

    document.getElementById('zoomResetBtn').onclick = () => {
      currentScale = 1.15;
      updatePageIndicator();
      renderAllPages();
    };

    document.getElementById('printBtn').onclick = () => {
      window.print();
    };

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'PageUp') {
        document.getElementById('prevBtn').click();
      } else if (e.key === 'ArrowDown' || e.key === 'PageDown') {
        document.getElementById('nextBtn').click();
      }
    });

    loadDocument();
  </script>
</body>
</html>
